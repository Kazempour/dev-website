# Basic config
baseURL = "https://vahid.dev"
theme = "hugo-bearcub"
copyright = "Vahid (CC BY 4.0)"
defaultContentLanguage = "en"

enableRobotsTXT = true

[markup]
  [markup.highlight]
    lineNos = true
    lineNumbersInTable = false
    noClasses = false

[languages]
  [languages.en]
    title = "Vahid"
    languageName = "en-US"
    LanguageCode = "en-US"
    contentDir = "content"
    [languages.en.params]
      madeWith = "Made with [Bear Cub](https://github.com/clente/hugo-bearcub)"

[params]
  description = "Personal website of Vahid — Cloud Engineer. Thoughts on technology, projects, and the occasional poem."
  favicon = "favicon.ico"
  title = "Vahid"
  dateFormat = "2006-01-02"
  hideUntranslated = false
  themeStyle = "original"
  generateSocialCard = false   # needs Hugo extended; not required for this site

  [params.author]
    name = "Vahid"
    email = "contact@vahid.dev"

# Top navigation: Home / Blog / RSS  (Bear Cub reads .Site.Menus.main)
[[menus.main]]
  name = "Home"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Blog"
  url = "/posts/"
  weight = 2
[[menus.main]]
  name = "RSS"
  url = "/index.xml"
  weight = 3
